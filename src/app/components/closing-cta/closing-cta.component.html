<section class="closing-cta text-center">
    <div class="cta-pattern"></div>
    <div class="container position-relative z-1">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <h2 class="display-5 mb-4">Llegó el momento de profesionalizar las ventas de tu negocio de comida.</h2>
                <p class="fs-5 text-secondary mb-5">Regístrate hoy, carga tus platos y empieza a recibir pedidos con una experiencia premium. No requerimos tarjeta de crédito.</p>
                
                <!-- 🌟 Convertimos el botón en un enlace directo a tu WhatsApp comercial -->
                <a [href]="'https://wa.me/' + phone + '?text=' + message" 
                    target="_blank" 
                    class="btn btn-brand-primary btn-lg px-5 py-3 fs-4 text-decoration-none">
                    <i class="fab fa-whatsapp me-2"></i> Crear mi Menú Ahora
                    </a>

            </div>
        </div>
    </div>
</section>
