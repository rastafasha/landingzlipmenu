<!-- 🎬 CONTENEDOR INTRO: Controla el baile inicial de la marca y migra al Navbar automáticamente -->
<div class="intro-container">
  <img src="assets/svg/logo-zlipmenu_logo.svg" alt="Zlipmenu Isotipo" class="anim-logo" />
  <img src="assets/svg/logo-zlipmenu_tipo.svg" alt="Zlipmenu Logotipo" class="anim-tipo" />
</div>
<!-- Hero Section Principal -->
<div class="position-relative overflow-hidden py-5 my-md-5">
  <div class="container text-center d-flex flex-column align-items-center px-4" style="max-width: 800px;">
    
    <!-- Tag / Badge Multirubro -->
    <span class="d-inline-flex align-items-center gap-2 bg-apple-light border border-apple text-apple-muted small px-3 py-1 rounded-pill mb-4 text-uppercase tracking-wider hero-reveal hero-delay-1" style="font-size: 11px; font-weight: 500;">
      <span class="rounded-circle bg-success" style="width: 6px; height: 6px;"></span> Ahora para cualquier rubro comercial
    </span>

    <!-- Titular Principal -->
    <h1 class="display-4 fw-bold tracking-tight text-dark mb-4 px-md-3 hero-reveal hero-delay-2" style="line-height: 1.15; letter-spacing: -0.025em;">
      Crea el catálogo digital de tu negocio. <span class="text-apple-light">Vende sin intermediarios.</span>
    </h1>

    <!-- Subtítulo -->
    <p class="lead text-apple-muted mb-4 px-md-5 mx-md-2 hero-reveal hero-delay-3" style="font-size: 1.15rem; line-height: 1.6; font-weight: 400;">
      Gestiona tus productos en tiempo real, automatiza tus pedidos por WhatsApp y ofrece una experiencia de compra impecable desde cualquier dispositivo.
    </p>

    <!-- Botones de Acción Duales -->
    <div class="d-flex flex-column flex-sm-row align-items-center gap-3 mb-5 w-100 justify-content-center hero-reveal hero-delay-4">
       <a [href]="'https://wa.me/' + phone + '?text=' + message" target="_blank"
        class="btn-apple-primary text-center w-auto">
        <i class="fab fa-whatsapp me-2"></i> Crear mi catálogo gratis
      </a>

     
      <a href="#como-funciona" class="btn-apple-link py-2">
        Ver cómo funciona 
        <svg class="bi bi-chevron-right" width="14" height="14" fill="currentColor" viewBox="0 0 16 16">
          <path fill-rule="evenodd" d="M4.646 1.646a.5.5 0 0 1 .708 0l6 6a.5.5 0 0 1 0 .708l-6 6a.5.5 0 0 1-.708-.708L10.293 8 4.646 2.354a.5.5 0 0 1 0-.708z"/>
        </svg>
      </a>
    </div>

    <!-- Preview del Producto Flotante (Mockup Completo Restaurado) -->
    <div class="w-100 bg-white border border-apple p-2 rounded-4 shadow-sm mockup-reveal hero-delay-5" style="max-width: 960px; margin-top: 2rem;">
      <div class="rounded-3 overflow-hidden bg-apple-light border border-light position-relative" style="aspect-ratio: 16/9;">
        
        <!-- Simulación del Admin Panel (admin-ang-mall) -->
        <div class="position-absolute inset-0  d-flex   h-100 w-100">
          <img src="assets/admin/dashboard.png" style="width: 100%;" alt="zlipmenu dashboard">
        </div>

        
      </div>
    </div>

  </div>
</div>
